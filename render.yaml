# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two ways to use this repo on Render:
#   A) Dashboard wizard: New → Web Service → connect this repo → Docker runtime.
#   B) Blueprint (this file): New → Blueprint → pick this repo. Render reads the
#      service + env-var list below and prompts you for the `sync: false` secrets.
#
# Either way the app builds from the existing Dockerfile. MongoDB is NOT defined
# here — use a free MongoDB Atlas M0 cluster and paste its URI into DB_URL.
services:
  - type: web
    name: library-management-system
    runtime: docker          # build from ./Dockerfile
    plan: free               # free tier: sleeps after ~15 min idle, ~50s cold start
    branch: main             # the branch Render deploys
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # APP_URL is OPTIONAL: the app falls back to Render's auto-injected
      # RENDER_EXTERNAL_URL, so email/QR/OAuth links work without setting it.
      # Set it only if you attach a custom domain.
      - key: APP_URL
        sync: false
      # --- Secrets: set these in the Render dashboard (never commit real values) ---
      - key: DB_URL            # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: JWT_PRIVATE_KEY   # auto-generated by Render on first sync — nothing to set
        generateValue: true
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
