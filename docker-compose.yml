services:
  app:
    build: .
    container_name: library-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    # Load all secrets/config from .env (GOOGLE_*, GEMINI/GROQ, EMAIL_*, JWT, APP_URL).
    # env_file passes values literally, so a '$' in a secret is not interpolated.
    env_file:
      - path: .env
        format: raw
    # Container-specific overrides (take precedence over env_file).
    # DB_URL must point at the 'mongo' service, not whatever .env holds.
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URL: mongodb://mongo:27017/library-management-system
    volumes:
      # Persist uploaded images outside the container
      - uploads:/app/public/images
      - user_uploads:/app/public/user_images
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    container_name: library-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads:
  user_uploads:
