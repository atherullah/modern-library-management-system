version: '3.9'

services:
  app:
    build: .
    container_name: library-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URL: mongodb://mongo:27017/library-management-system
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      # Persist uploaded images outside the container
      - uploads:/app/public/images
      - user_uploads:/app/public/user_images
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    container_name: library-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads:
  user_uploads:
